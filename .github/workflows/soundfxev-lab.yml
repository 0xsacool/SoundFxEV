name: SoundFxEV Alpha APK
on:
  push:
    branches: ['dev/soundfxev-lab']
    paths:
      - 'soundfxev/**'
      - '.github/workflows/soundfxev-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Test DSP and assemble
        run: ./gradlew -p soundfxev testDebugUnitTest assembleDebug --stacktrace
      - name: Report DSP results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('soundfxev/build/test-results/testDebugUnitTest/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for failure in root.findall('.//failure'):
                  print(failure.get('message'))
              for line in (root.findtext('system-out') or '').splitlines():
                  if 'Coast RMS:' in line:
                      print(line)
          PY
      - name: Prepare APK
        run: cp "$(find soundfxev/build/outputs/apk/debug -name '*.apk' -print -quit)" SoundFxEV-0.1.0-alpha.7.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SoundFxEV-0.1.0-alpha.7.2
          path: SoundFxEV-0.1.0-alpha.7.2.apk
          if-no-files-found: error
