name: SoundFxEV Alpha APK
on:
  push:
    branches: ['dev/soundfxev-lab']
    paths:
      - 'soundfxev/**'
      - '.github/workflows/soundfxev-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Test DSP and assemble
        run: ./gradlew -p soundfxev testDebugUnitTest assembleDebug --stacktrace
      - name: Prepare APK
        run: cp "$(find soundfxev/build/outputs/apk/debug -name '*.apk' -print -quit)" SoundFxEV-0.1.0-alpha.7.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SoundFxEV-0.1.0-alpha.7.1
          path: SoundFxEV-0.1.0-alpha.7.1.apk
          if-no-files-found: error
